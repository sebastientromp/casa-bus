name: Publish the map

on:
  push:
    branches: [master]
  schedule:
    # Every Monday at 04:00 UTC, to pick up new timetables.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Keeps the last downloaded timetables, in case a source is down during a build.
      - uses: actions/cache@v4
        with:
          path: data
          key: timetables-${{ github.run_id }}
          restore-keys: timetables-
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
