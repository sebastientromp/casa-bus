<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valbonne Bus Map</title>
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Map of buses and trams in the Alpes-Maritimes"></div>

    <aside class="panel" aria-label="Map controls">
      <header>
        <h1>Buses of the 06</h1>
        <p id="status" class="status" role="status">Loading the network...</p>
      </header>

      <section>
        <div class="replay" id="replay">
          <p class="clock" id="replay-clock" aria-live="off"></p>
          <div class="replay-row">
            <button type="button" class="play" id="replay-play">Pause</button>
            <label>Speed
              <select id="replay-speed">
                <option value="1">Real time</option>
                <option value="10">10×</option>
                <option value="60">1 min per second</option>
                <option value="300" selected>5 min per second</option>
                <option value="900">15 min per second</option>
                <option value="3600">1 hour per second</option>
              </select>
            </label>
          </div>
          <label class="replay-at">Date and time
            <input type="datetime-local" id="replay-at" step="60" />
          </label>
          <label class="replay-skip"><input type="checkbox" id="replay-skip" checked /> Skip times with nothing running</label>
          <p class="note">Positions come from the published timetables (updated <span id="data-date"></span>), not from real vehicles.</p>
        </div>
      </section>

      <section>
        <h2 id="window-label">Colour roads by passages</h2>
        <div class="segmented" id="window-choice" role="radiogroup" aria-labelledby="window-label">
          <button type="button" role="radio" data-window="today" aria-checked="true">Day so far</button>
          <button type="button" role="radio" data-window="hour" aria-checked="false">Last hour</button>
          <button type="button" role="radio" data-window="full" aria-checked="false">Full day</button>
        </div>

        <div class="legend" aria-label="Colour scale">
          <div class="ramp" id="ramp"></div>
          <div class="ticks" id="ticks-roads"></div>
          <div class="ticks" id="ticks-areas"></div>
          <p class="note">Top: passages on a road. Bottom: passages at stops within 400 m of an area.</p>
        </div>

        <div class="toggles">
          <label><input type="checkbox" id="toggle-roads" checked /> Roads</label>
          <label><input type="checkbox" id="toggle-areas" checked /> Areas</label>
          <label><input type="checkbox" id="toggle-vehicles" checked /> Vehicles</label>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>Lines</h2>
          <button type="button" class="link" id="lines-all">All</button>
          <button type="button" class="link" id="lines-none">None</button>
        </div>
        <div id="lines"></div>
      </section>
    </aside>

    <script src="vendor/maplibre-gl.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
